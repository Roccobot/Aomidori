<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="32" height="32" viewBox="0 0 32 32">
  <title>Feedback Aomidori</title>
  <!-- AIV's DF notepad, with the glyph of Graphe's icon cut out of it: the open book of
       assets/favicon.svg (the same paths and the same four columns, drawn for small sizes), in
       the box AIV's glyph takes. The book is a hole, its columns stay in the notepad's colour.
       Author: Rocco Casadei, a.k.a. Roccobot -->
  <defs>
    <mask id="notepad" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect x="3" y="4.5" width="26" height="26" rx="5" fill="white"/>
      <rect x="10" y="1.5" width="12" height="9" rx="3" fill="white"/>
      <rect x="13" y="4.5" width="6" height="3" rx="1" fill="black"/>
      <g transform="translate(16 18.2) scale(.036) translate(-512 -527)">
        <g fill="black" stroke="black" stroke-width="22" stroke-linejoin="round">
          <path d="M500,372 C430,330 340,322 276,338 L276,690 C340,676 430,684 500,724 Z"/>
          <path d="M524,372 C594,330 684,322 748,338 L748,690 C684,676 594,684 524,724 Z"/>
        </g>
        <path d="M676,410 L676,650 M596,410 L596,600 M428,410 L428,646 M348,410 L348,596" fill="none" stroke="white" stroke-width="46" stroke-linecap="round"/>
      </g>
    </mask>
  </defs>
  <rect width="32" height="32" fill="#43B59E" mask="url(#notepad)"/>
</svg>
