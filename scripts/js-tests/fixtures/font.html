<?xml version="1.0" encoding="utf-8"?>
<html xmlns="http://www.w3.org/1999/xhtml"><head><title>Font</title>
<style>.heavy { font-weight: bold; } .light { font-weight: 300; } h2 { font-weight: 600; } .slanted { font-style: italic; }</style></head>
<body><h2 id="h2">Titolo</h2>
<p id="p">Testo <b id="b">grassetto</b>, <strong id="strong">forte</strong>, <span id="heavy" class="heavy">pesante</span>,
<span id="light" class="light">leggero</span>, <em id="em">corsivo</em>, <span id="slanted" class="slanted">inclinato</span>,
<code id="code">codice</code>.</p></body></html>
